[package]
name = "appdir-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pluggable directory-create event sources. v1 ships a deterministic simulator source and a user-mode ReadDirectoryChangesW watcher source. No kernel code."

[dependencies]
appdir-core = { path = "../core" }
windows = { version = "0.58", features = ["Win32_System_Diagnostics_Etw", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_Time"] }
